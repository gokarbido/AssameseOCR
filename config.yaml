augmentation:
  train:
  - degrees: 5
    type: RandomRotation
  - degrees: 0
    scale:
    - 0.9
    - 1.1
    translate:
    - 0.1
    - 0.1
    type: RandomAffine
  - brightness: 0.2
    contrast: 0.2
    hue: 0.1
    saturation: 0.2
    type: ColorJitter
  - blur_limit: 3
    type: MotionBlur
charset:
  blank: <blank>
  chars: '0123456789০১২৩৪৫৬৭৮৯!"#$%&''()*+,-./:;<=>?@[\]^_`{|}~ €।॥ঁংঃঅআইঈউঊঋঌএঐওঔকখগঘঙচছজঝঞটঠডঢণতথদধনপফবভমযৰলশষসহ়ঽািীুূৃৄেৈোৌ্ৎৗৠৡৢৣৱ৲৳৴৵৶৷৸৹৺৻–—…₹−◌

    '
  unknown: ''
dataset:
  train:
    batch_size: 128  # Much larger batch size for better GPU utilization
    data_dir: as_recognition_data/train
    img_height: 32
    img_width: 128
    label_file: as_recognition_data/train/labels.csv
    num_workers: 4  # Reduced to avoid overhead - 4 is often optimal
    shuffle: true
    pin_memory: true
    persistent_workers: true
    prefetch_factor: 4  # Increased prefetch for better pipeline
  valid:
    batch_size: 128  # Larger validation batch
    data_dir: as_recognition_data/valid
    img_height: 32
    img_width: 128
    label_file: as_recognition_data/valid/labels.csv
    num_workers: 2  # Reduced for validation
    shuffle: false
    pin_memory: true
    persistent_workers: true
    prefetch_factor: 2
model:
  backbone:
    attn_drop_rate: 0.0
    depth: 8  # Reduced depth for faster training while maintaining performance
    drop_path_rate: 0.1
    drop_rate: 0.0
    embed_dim: 256  # Increased embed_dim for better representation
    feature_extractor: VGG
    img_size:
    - 32
    - 128
    in_chans: 3
    is_export: false
    mlp_ratio: 4.0
    norm_layer: LayerNorm
    num_heads: 8  # Increased heads for better attention
    out_channels: 256
    patch_size: 4
    qkv_bias: true
    residual_block_indexes:
    - 1
    - 3
    - 5
    - 7
    type: SVTRv2_Backbone
    use_abs_pos: true
    use_conv_embed: true
    use_rel_pos: true
    window_block_indexes:
    - 0
    - 2
    - 4
    - 6
    window_size: 7
  head:
    fc_decay: 0.0004
    in_channels: 256
    out_channels: 256
    type: CTCHead
  type: SVTRv2
output:
  log_dir: logs
  model_name: svtrv2_assamese_vgg
  save_dir: outputs
  tensorboard_dir: tensorboard_logs
train:
  epochs: 150
  eval_interval: 5
  learning_rate: 0.0002  # Increased LR for faster convergence with larger batch size
  log_interval: 50  # More frequent logging for monitoring
  # Pretrained model configuration
  pretrained_model: ""  # Path to pretrained model (.pth file). Leave empty to train from scratch
  # Example: pretrained_model: "outputs/svtrv2_assamese_vgg_best.pth"
  # Example: pretrained_model: "saved_model/model_best.pth"
  optimizer:
    lr: 0.0002  # Increased LR for larger batch size
    type: AdamW
    weight_decay: 0.0001
    betas: [0.9, 0.999]  # Standard AdamW betas
  save_interval: 10
  scheduler:
    T_max: 100
    eta_min: 1.0e-06
    type: CosineAnnealingLR
  warmup_epochs: 5  # Reduced warmup for faster start
  weight_decay: 0.0001
  # Mixed precision training for speed and memory efficiency
  mixed_precision: true
  # Gradient accumulation for effective larger batch sizes
  gradient_accumulation_steps: 1 