services:
  assamese-ocr:
    image: assamese-ocr:jetpack6
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BASE_IMAGE: ${BASE_IMAGE:-nvcr.io/nvidia/l4t-jetpack:r36.4.0}
        ONNXRUNTIME_WHEEL_URL: ${ONNXRUNTIME_WHEEL_URL:-https://pypi.jetson-ai-lab.io/jp6/cu126/+f/4eb/e6a8902dc7708/onnxruntime_gpu-1.23.0-cp310-cp310-linux_aarch64.whl}
    platform: linux/arm64
    runtime: nvidia
    ports:
      - "${WEB_PORT:-8000}:8000"
    volumes:
      - ./models/translation:/opt/translation-models:ro
      - type: bind
        source: /tmp/argus_socket
        target: /tmp/argus_socket
        bind:
          create_host_path: false
    environment:
      ENABLE_TRANSLATION: ${ENABLE_TRANSLATION:-1}
      TRANSLATION_MODEL_DIR: /opt/translation-models/indictrans2-int8
      CAMERA_GSTREAMER: ${CAMERA_GSTREAMER:-1}
      CAMERA_SOURCE: >-
        ${CAMERA_SOURCE:-nvarguscamerasrc sensor-id=0 !
        video/x-raw(memory:NVMM),width=1920,height=1080,framerate=30/1 !
        nvvidconv ! video/x-raw,format=BGRx ! videoconvert !
        video/x-raw,format=BGR ! appsink drop=true max-buffers=1 sync=false}
    restart: unless-stopped
    stop_grace_period: 15s
