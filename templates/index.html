<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Assamese OCR · Live</title>
<style>
  :root{color-scheme:dark;font-family:system-ui,sans-serif;background:#10161d;color:#ecf1f5}
  *{box-sizing:border-box}body{margin:0}main{max-width:1440px;margin:auto;padding:32px}
  header{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:28px}
  h1{font-size:24px;letter-spacing:-.6px;margin:0 0 6px}p{color:#a5b3c0;margin:0;line-height:1.6}
  .tag{font-size:12px;letter-spacing:2px;color:#71d9b1;margin-bottom:12px}
  #status{border:1px solid #36424f;border-radius:30px;padding:8px 14px;white-space:nowrap;font-size:14px}
  #status[data-state=live]{color:#71d9b1;border-color:#376d5a}#status[data-state=error]{color:#ffadad}
  .layout{display:grid;grid-template-columns:minmax(0,3fr) minmax(260px,1fr);gap:20px}
  .panel{background:#19222c;border:1px solid #2c3845;border-radius:16px;overflow:hidden}
  .video{position:relative;aspect-ratio:16/9;background:#090e13;display:grid;place-items:center}
  #feed{display:block;width:100%;height:100%;object-fit:contain;position:absolute}
  #placeholder{padding:24px;text-align:center;color:#a5b3c0}
  .bar{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px 20px}
  button{font:inherit;background:#71d9b1;color:#0e2720;border:0;border-radius:8px;padding:8px 16px;cursor:pointer}
  button:focus-visible{outline:3px solid white;outline-offset:3px}
  aside{padding:22px}h2{font-size:16px;margin:0 0 12px}#texts{padding-left:22px;line-height:1.8;overflow-wrap:anywhere}
  #texts li{padding:10px 0;border-bottom:1px solid #2c3845}#message{margin-top:16px;font-size:14px}
  footer{margin-top:20px;color:#8495a6;font-size:13px}a{color:#71d9b1}
  [hidden]{display:none!important}@media(max-width:850px){main{padding:20px}.layout{grid-template-columns:1fr}header{align-items:flex-start}.bar{flex-wrap:wrap}}
</style>
<main>
  <header>
    <div><div class="tag">LIVE VISION</div><h1>Assamese OCR</h1><p>Text recognition, straight from your camera.</p></div>
    <span id="status" role="status" data-state="waiting">Connecting…</span>
  </header>
  <div class="layout">
    <section class="panel" aria-label="Live camera">
      <div class="video"><span id="placeholder">Waiting for the camera…</span><img id="feed" alt="Live camera with detected Assamese text" hidden></div>
      <div class="bar"><span><strong id="fps">—</strong> FPS · annotated feed</span><button id="toggle" type="button">Pause view</button></div>
    </section>
    <aside class="panel"><h2>Recognized text</h2><p id="empty">Detected text will appear here.</p><ol id="texts" lang="as"></ol><p id="message" role="status"></p></aside>
  </div>
  <footer>Processed on your device · Pause affects only this browser view.</footer>
</main>
<script>
  const feed=document.getElementById('feed'),badge=document.getElementById('status');
  const placeholder=document.getElementById('placeholder'),message=document.getElementById('message');
  let paused=false,streamOpen=false;
  function disconnect(){feed.removeAttribute('src');feed.hidden=true;streamOpen=false;placeholder.hidden=false}
  function connect(){if(!paused&&!streamOpen){streamOpen=true;feed.src='/video?t='+Date.now()}}
  feed.onload=()=>{feed.hidden=false;placeholder.hidden=true};
  feed.onerror=()=>{disconnect();placeholder.textContent='Reconnecting to the video…'};
  document.getElementById('toggle').onclick=()=>{
    paused=!paused;document.getElementById('toggle').textContent=paused?'Resume view':'Pause view';
    if(paused){disconnect();placeholder.textContent='View paused'}else{placeholder.textContent='Connecting…';connect()}
  };
  async function poll(){
    try{
      const response=await fetch('/api/status',{cache:'no-store'});if(!response.ok)throw Error('Status unavailable');
      const data=await response.json();badge.dataset.state=data.state;
      badge.textContent=data.state==='live'?'● Live':data.state==='error'?'Camera offline':'Starting…';
      document.getElementById('fps').textContent=data.state==='live'?data.fps:'—';
      message.textContent=data.error||(data.state==='waiting'?'Loading models or waiting for frames…':'');
      document.getElementById('texts').replaceChildren(...data.texts.map(text=>{const li=document.createElement('li');li.textContent=text;return li}));
      document.getElementById('empty').hidden=data.texts.length>0;
      if(data.state==='live')connect();else{disconnect();placeholder.textContent=paused?'View paused':data.state==='error'?'Camera unavailable':'Waiting for the camera…'}
    }catch(error){badge.textContent='Disconnected';badge.dataset.state='error';message.textContent='Cannot reach the server. Retrying…';disconnect()}
    setTimeout(poll,1000);
  }
  poll();
</script>
</html>
